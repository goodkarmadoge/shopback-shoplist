<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ShopList tutorial video widget</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
</style>
</helmet>
<div style="width: 358px; height: 300px; box-sizing: border-box; color: #1F2937; font-family: -apple-system, 'SF Pro Text', Roboto, 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; gap: 10px">
<div style="position: relative; width: 358px; height: 200px; border-radius: 18px; overflow: hidden; background: #1F2937; flex: none">
<sc-if value="{{ isPoster }}" hint-placeholder-val="{{ true }}">
<button aria-label="Play the 45-second ShopList tour" onClick="{{ play }}" style="position: absolute; inset: 0; width: 100%; height: 100%; border: none; padding: 18px; background: #1F2937; color: #FFFFFF; font-family: inherit; text-align: left; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer">
<span style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; font-weight: 700; color: #FCA5A5; letter-spacing: 0.5px">TUTORIAL</span>
<span style="font-size: 20px; font-weight: 800; letter-spacing: -0.3px">How ShopList works</span>
<span style="font-size: 13px; color: #D1D5DB">45 seconds · 4 chapters · captions on</span>
</span>
<span style="display: flex; gap: 6px" aria-hidden="true">
<span style="font-size: 11px; font-weight: 700; color: #046C4E; background: #DEF7EC; padding: 4px 8px; border-radius: 10px">Recurring</span>
<span style="font-size: 11px; font-weight: 700; color: #1F2937; background: #FFFFFF; padding: 4px 8px; border-radius: 10px">To Buy</span>
<span style="font-size: 11px; font-weight: 700; color: #6B21A8; background: #F3E8FF; padding: 4px 8px; border-radius: 10px">Wishlist</span>
</span>
<span aria-hidden="true" style="position: absolute; right: 22px; top: 50%; margin-top: -32px; width: 64px; height: 64px; border-radius: 32px; background: #D92D2A; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 8px rgba(217,45,42,0.25)">
<svg width="26" height="26" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M8 5l12 7-12 7z"></path></svg>
</span>
</button>
</sc-if>
<sc-if value="{{ c0 }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; right: 0; top: 0; height: 156px; display: flex; align-items: center; justify-content: center; padding: 0 24px; box-sizing: border-box">
<div style="width: 100%; background: #FFFFFF; border-radius: 22px; height: 46px; display: flex; align-items: center; gap: 10px; padding: 0 14px; box-sizing: border-box">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D92D2A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg>
<span style="flex: 1; font-size: 14px; color: #1F2937">soundbar for the living room|</span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4B5563" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
</div>
</div>
</sc-if>
<sc-if value="{{ c1 }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; right: 0; top: 0; height: 156px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
<span style="width: 220px; box-sizing: border-box; font-size: 14px; font-weight: 700; color: #046C4E; background: #DEF7EC; padding: 8px 14px; border-radius: 14px">Recurring · Dog food</span>
<span style="width: 220px; box-sizing: border-box; font-size: 14px; font-weight: 700; color: #1F2937; background: #FFFFFF; padding: 8px 14px; border-radius: 14px; margin-left: 24px">To Buy · Soundbar</span>
<span style="width: 220px; box-sizing: border-box; font-size: 14px; font-weight: 700; color: #6B21A8; background: #F3E8FF; padding: 8px 14px; border-radius: 14px">Wishlist · Espresso machine</span>
</div>
</sc-if>
<sc-if value="{{ c2 }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; right: 0; top: 0; height: 156px; display: flex; align-items: center; justify-content: center">
<div style="width: 270px; background: #FFFFFF; border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px">
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 11px; font-weight: 700; color: #4B5563">YOUR AGENT</span>
<span style="font-size: 15px; font-weight: 800">3 things need a yes</span>
</span>
<span style="font-size: 13px; font-weight: 700; color: #FFFFFF; background: #D92D2A; padding: 8px 14px; border-radius: 16px">Review</span>
</div>
</div>
</sc-if>
<sc-if value="{{ c3 }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; right: 0; top: 0; height: 156px; display: flex; align-items: center; justify-content: center; gap: 14px">
<svg role="img" aria-label="Wish Jar, 13 percent full" width="96" height="96" viewBox="0 0 96 96"><circle cx="48" cy="48" r="38" fill="none" stroke="#4C1D95" stroke-width="10"></circle><circle cx="48" cy="48" r="38" fill="none" stroke="#E9D5FF" stroke-width="10" stroke-linecap="round" stroke-dasharray="31 239" transform="rotate(-90 48 48)"></circle></svg>
<span style="display: flex; flex-direction: column; gap: 2px; color: #FFFFFF">
<span style="font-size: 12px; font-weight: 700; color: #E9D5FF">WISH JAR</span>
<span style="font-size: 24px; font-weight: 800">$54</span>
<span style="font-size: 13px; color: #D1D5DB">of $420</span>
</span>
</div>
</sc-if>
<sc-if value="{{ showCaption }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 12px; right: 12px; bottom: 50px; display: flex; justify-content: center">
<span style="background: rgba(0,0,0,0.75); color: #FFFFFF; font-size: 13px; line-height: 1.35; padding: 5px 10px; border-radius: 8px; text-align: center">{{ caption }}</span>
</div>
</sc-if>
<sc-if value="{{ started }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 6px; box-sizing: border-box; background: rgba(17,24,39,0.6)">
<sc-if value="{{ playing }}" hint-placeholder-val="{{ false }}">
<button aria-label="Pause" onClick="{{ pause }}" style="width: 44px; height: 44px; border: none; background: none; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="#FFFFFF"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></button>
</sc-if>
<sc-if value="{{ paused }}" hint-placeholder-val="{{ true }}">
<button aria-label="Play" onClick="{{ play }}" style="width: 44px; height: 44px; border: none; background: none; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M8 5l12 7-12 7z"></path></svg></button>
</sc-if>
<div style="flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.3); position: relative" aria-hidden="true">
<div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{ pct }}%; background: #D92D2A; border-radius: 2px"></div>
<div style="position: absolute; left: 26.7%; top: -2px; width: 2px; height: 8px; background: #FFFFFF"></div>
<div style="position: absolute; left: 53.3%; top: -2px; width: 2px; height: 8px; background: #FFFFFF"></div>
<div style="position: absolute; left: 80%; top: -2px; width: 2px; height: 8px; background: #FFFFFF"></div>
</div>
<span style="font-size: 12px; font-weight: 600; color: #FFFFFF; min-width: 74px; text-align: center">{{ time }} / 0:45</span>
<button aria-label="Captions" aria-pressed="{{ cc }}" onClick="{{ toggleCc }}" style="width: 44px; height: 44px; border: none; background: none; color: #FFFFFF; font-size: 12px; font-weight: 800; font-family: inherit; cursor: pointer">CC</button>
</div>
</sc-if>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{ chapters }}" as="ch" hint-placeholder-count="4">
<sc-if value="{{ ch.active }}" hint-placeholder-val="{{ false }}">
<button onClick="{{ ch.jump }}" style="height: 44px; border: 2px solid #1F2937; border-radius: 22px; background: #F5F5F5; color: #1F2937; font-size: 13px; font-weight: 700; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer"><span style="color: #4B5563; font-weight: 600">{{ ch.at }}</span>{{ ch.label }}</button>
</sc-if>
<sc-if value="{{ ch.inactive }}" hint-placeholder-val="{{ true }}">
<button onClick="{{ ch.jump }}" style="height: 44px; border: 1px solid #D1D5DB; border-radius: 22px; background: #FFFFFF; color: #1F2937; font-size: 13px; font-weight: 600; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer"><span style="color: #4B5563">{{ ch.at }}</span>{{ ch.label }}</button>
</sc-if>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":358,"height":300}}'>
class Component extends DCLogic {
componentWillUnmount() {
if (this.timer) { clearInterval(this.timer); this.timer = null; }
}
getS() {
var s = this.state || {};
return { playing: !!s.playing, t: s.t || 0, cc: s.cc !== false };
}
play() {
if (this.timer) return;
var self = this;
if (this.getS().t >= 45) this.setState({ t: 0 });
this.setState({ playing: true });
this.timer = setInterval(function () {
var t = self.getS().t + 0.25;
if (t >= 45) {
clearInterval(self.timer); self.timer = null;
self.setState({ t: 45, playing: false });
} else {
self.setState({ t: t });
}
}, 250);
}
pause() {
if (this.timer) { clearInterval(this.timer); this.timer = null; }
this.setState({ playing: false });
}
renderVals() {
var self = this;
var s = this.getS();
var chs = [
{ s: 0, at: '0:00', label: 'Add anything', cap: 'Type, speak or snap a photo. One word is enough.' },
{ s: 12, at: '0:12', label: 'Three lists', cap: 'Recurring, To Buy and Wishlist live in one place.' },
{ s: 24, at: '0:24', label: 'Your agent', cap: 'It watches prices and Cashback, then asks for your yes.' },
{ s: 36, at: '0:36', label: 'Wish Jar', cap: 'Cashback from everyday buys fills a wish.' }
];
var ci = 0;
for (var i = 0; i < chs.length; i++) { if (s.t >= chs[i].s) ci = i; }
var isPoster = !s.playing && s.t === 0;
var secs = Math.floor(s.t);
var time = Math.floor(secs / 60) + ':' + (secs % 60 < 10 ? '0' : '') + (secs % 60);
return {
isPoster: isPoster,
started: !isPoster,
playing: s.playing,
paused: !s.playing,
cc: s.cc,
c0: !isPoster && ci === 0,
c1: !isPoster && ci === 1,
c2: !isPoster && ci === 2,
c3: !isPoster && ci === 3,
showCaption: s.cc && !isPoster,
caption: chs[ci].cap,
pct: (s.t / 45 * 100).toFixed(1),
time: time,
play: function () { self.play(); },
pause: function () { self.pause(); },
toggleCc: function () { self.setState({ cc: !s.cc }); },
chapters: chs.map(function (c, k) {
var active = !isPoster && k === ci;
return {
at: c.at, label: c.label, active: active, inactive: !active,
jump: function () { self.setState({ t: c.s === 0 ? 0.25 : c.s }); self.play(); }
};
})
};
}
}
</script>
</body>
</html>
