<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The ShopList tutorial video, full screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#93C5FD}a:hover{color:#BFDBFE}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #111827; color: #FFFFFF; font-family: Figtree, -apple-system, 'SF Pro Text', Roboto, 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="padding: 8px 8px 0; display: flex; align-items: center; gap: 4px; flex: none">
<a href="O1Welcome.dc.html" aria-label="Close video" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
<h1 style="margin: 0; flex: 1; font-size: 15px; font-weight: 700">How ShopList works</h1>
<span style="font-size: 12px; color: #D1D5DB; padding-right: 12px">40 sec · captions on</span>
</div>
<div style="flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 8px 16px">
<video id="tutvid" controls playsinline preload="metadata" poster="media/shoplist-tutorial-poster.jpg" src="media/shoplist-tutorial.mp4" aria-label="ShopList tutorial video, 40 seconds, with captions" style="height: 100%; max-width: 100%; aspect-ratio: 9 / 16; border-radius: 18px; background: #000000; display: block"></video>
</div>
<div style="margin: 0 16px; background: #1F2937; border-radius: 18px; padding: 4px 6px; display: flex; flex-direction: column; flex: none">
<button id="tutch0" onClick="{{ jump0 }}" style="min-height: 44px; border: none; background: none; border-radius: 12px; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 12px; padding: 0 10px; text-align: left; cursor: pointer"><span style="width: 36px; color: #9CA3AF; flex: none">0:00</span><span style="flex: 1">Add anything</span><span data-playing style="font-size: 11px; font-weight: 700; color: #FCA5A5; letter-spacing: 0.5px; visibility: hidden">PLAYING</span></button>
<button id="tutch1" onClick="{{ jump1 }}" style="min-height: 44px; border: none; background: none; border-radius: 12px; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 12px; padding: 0 10px; text-align: left; cursor: pointer"><span style="width: 36px; color: #9CA3AF; flex: none">0:10</span><span style="flex: 1">Buy Now · Wish List · Recurring</span><span data-playing style="font-size: 11px; font-weight: 700; color: #FCA5A5; letter-spacing: 0.5px; visibility: hidden">PLAYING</span></button>
<button id="tutch2" onClick="{{ jump2 }}" style="min-height: 44px; border: none; background: none; border-radius: 12px; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 12px; padding: 0 10px; text-align: left; cursor: pointer"><span style="width: 36px; color: #9CA3AF; flex: none">0:20</span><span style="flex: 1">Karma’s price check</span><span data-playing style="font-size: 11px; font-weight: 700; color: #FCA5A5; letter-spacing: 0.5px; visibility: hidden">PLAYING</span></button>
<button id="tutch3" onClick="{{ jump3 }}" style="min-height: 44px; border: none; background: none; border-radius: 12px; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 12px; padding: 0 10px; text-align: left; cursor: pointer"><span style="width: 36px; color: #9CA3AF; flex: none">0:31</span><span style="flex: 1">Buy for less</span><span data-playing style="font-size: 11px; font-weight: 700; color: #FCA5A5; letter-spacing: 0.5px; visibility: hidden">PLAYING</span></button>
</div>
<div style="padding: 10px 16px 14px; flex: none">
<a href="O3Lists.dc.html" style="height: 52px; border-radius: 26px; background: #FFFFFF; color: #111111; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Skip and start my ShopList</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
video() { return document.getElementById('tutvid'); }
mark() {
var v = this.video();
if (!v) return;
var starts = [0, 10, 20, 31];
var ci = 0;
for (var i = 0; i < starts.length; i++) { if (v.currentTime >= starts[i]) ci = i; }
var active = !v.paused || v.currentTime > 0;
for (var k = 0; k < starts.length; k++) {
var b = document.getElementById('tutch' + k);
if (!b) continue;
var on = active && k === ci;
b.style.background = on ? 'rgba(255,255,255,0.08)' : 'none';
b.style.fontWeight = on ? '700' : '600';
b.setAttribute('aria-current', on ? 'true' : 'false');
var tag = b.querySelector('[data-playing]');
if (tag) { tag.style.visibility = on ? 'visible' : 'hidden'; tag.textContent = v.paused ? 'PAUSED' : 'PLAYING'; }
}
}
componentDidMount() {
var self = this;
var v = this.video();
if (!v) return;
this.onTime = function () { self.mark(); };
['timeupdate', 'play', 'pause', 'seeked', 'ended'].forEach(function (e) { v.addEventListener(e, self.onTime); });
var start = window.__shoplistTourStart;
window.__shoplistTourStart = null;
if (typeof start === 'number') { this.go(start); }
}
componentWillUnmount() {
var v = this.video();
if (v) v.pause();
}
go(t) {
var v = this.video();
if (!v) return;
var seek = function () { try { v.currentTime = t; } catch (e) { /* not ready yet */ } };
if (v.readyState >= 1) seek(); else v.addEventListener('loadedmetadata', seek, { once: true });
var p = v.play();
if (p && p.catch) p.catch(function () { /* the browser wants a tap first */ });
}
renderVals() {
var self = this;
return {
jump0: function () { self.go(0); },
jump1: function () { self.go(10); },
jump2: function () { self.go(20); },
jump3: function () { self.go(31); }
};
}
}
</script>
</body>
</html>
